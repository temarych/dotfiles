prefix_mode="#[bg=$red fg=$bg] PREFIX #[default]"
copy_mode="#[bg=$green fg=$bg] COPY #[default]"
normal_mode="#[bg=$blue fg=$bg] NORMAL #[default]"
mode="#{?client_prefix,$prefix_mode,#{?pane_in_mode,$copy_mode,$normal_mode}}"

session="#[fg=$magenta]󰋞 #S#[default]"

set -g status-position "top"
set -g status-style "bg=default fg=default"
set -g status-justify "left"

set -g status-left " $session  "
set -g status-left-length 50

set -g window-status-separator "  "
set -g window-status-current-format "#[fg=$blue]#I #W"
set -g window-status-format "#[fg=$dim_fg]#I #W"
