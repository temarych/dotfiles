set -g mode-style "noattr bg=$muted"

set -g message-style "fg=$fg bg=$bg"
set -g message-command-style "fg=$fg bg=default"

run -C "set -g prompt-cursor-colour '$fg'"

set -g pane-border-style "fg=$muted"
set -g pane-active-border-style "fg=$blue"

set -g popup-border-style "fg=$muted"

set -g display-panes-colour "$muted"
set -g display-panes-active-colour "$muted"
